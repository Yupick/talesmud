id: R2011
name: Ossuary
area: The Buried Vault
description: A charnel house of stacked skulls. An ornate chest sits on a plinth at the center — too neat,
  too inviting. The Vault Golem crouches behind it, patient as stone.
exits:
- name: north
  target: R2010
  type: normal
  description: Climb back up to the Reliquary.
- name: south
  target: R2012
  type: normal
  description: Approach the Warden's Threshold.
actions:
- name: open ornate chest
  type: response
  description: Work the chest's latch.
  response: The latch clicks — and a volley of darts spits from the plinth. You take 6 damage before the
    trap runs dry. The chest itself holds only dust and old cloth.
