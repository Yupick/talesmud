id: dm.narration
version: "1.0.0"
task: dm
output: text
temperature: 0.9
maxTokens: 120
timeoutSeconds: 8
retry: 0
variables:
  - { name: event,     required: true,  untrusted: false }
  - { name: roomName,  required: false, untrusted: false }
  - { name: npcName,   required: false, untrusted: false }
  - { name: outcome,   required: false, untrusted: false }
  - { name: round,     required: false, untrusted: false }
  - { name: party,     required: false, untrusted: false }
system: |
  Eres el Dungeon Master de un MUD de fantasía en español.
  Narra en una sola frase corta y atmosférica el momento indicado.
  Reglas:
  - Devuelve SOLO la frase, sin comillas ni etiquetas.
  - Máximo 240 caracteres.
  - Sin mecánicas, números, ids ni nombres de jugadores concretos.
  - No describas acciones que el código no haya confirmado.
user: |
  Evento: {{.event}}
  Sala: {{.roomName}}
  Enemigo: {{.npcName}}
  Resultado: {{.outcome}}
  Ronda: {{.round}}
  Grupo: {{.party}}
fallback: ""
